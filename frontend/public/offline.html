<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoneyDock – Offline</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0e14;
            color: #d1d4dc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .icon-wrap {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            box-shadow: 0 0 40px rgba(79, 70, 229, 0.35);
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 40px rgba(79, 70, 229, 0.35);
            }

            50% {
                box-shadow: 0 0 60px rgba(79, 70, 229, 0.55);
            }
        }

        .icon-wrap svg {
            width: 52px;
            height: 52px;
            color: #ffffff;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.75rem;
        }

        p {
            font-size: 1rem;
            color: #868993;
            max-width: 360px;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: #14161f;
            border: 1px solid #2a2e39;
            border-radius: 999px;
            padding: 0.35rem 1rem;
            font-size: 0.8rem;
            color: #868993;
            margin-bottom: 2rem;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0.75rem 2rem;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s ease, transform 0.15s ease;
        }

        .btn:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }

        .brand {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .brand span {
            color: #4f46e5;
        }
    </style>
</head>

<body>

    <div class="brand">Money<span>Dock</span></div>

    <div class="icon-wrap">
        <!-- Wifi-off icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23" />
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
            <path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
            <circle cx="12" cy="20" r="1" fill="currentColor" />
        </svg>
    </div>

    <div class="badge">
        <span class="badge-dot"></span>
        No internet connection
    </div>

    <h1>You're offline</h1>
    <p>MoneyDock needs an internet connection to show live market data. Please check your connection and try again.</p>

    <button class="btn" onclick="window.location.reload()">↻ Try Again</button>

</body>

</html>
